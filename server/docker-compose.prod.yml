services:
  api:
    build:
      context: .
    container_name: aaj-kya-banau-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      PORT: 8080
      NODE_ENV: production
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
